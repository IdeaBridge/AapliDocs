<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Admin spacing, shape and icons" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin spacing, shape and icons</title>
<rect width="1040" height="330" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Spacing, shape and icons</text><rect x="16" y="54" width="8" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="66" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-0</text><text x="270" y="66" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">2px · nav or rail item gap</text><rect x="16" y="82" width="16" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="94" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-1</text><text x="270" y="94" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">4px · label → input</text><rect x="16" y="110" width="32" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="122" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-2</text><text x="270" y="122" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">8px · between toolbar buttons</text><rect x="16" y="138" width="48" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="150" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-3</text><text x="270" y="150" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">12px · cell padding x, app bar y</text><rect x="16" y="166" width="64" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="178" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-4</text><text x="270" y="178" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">16px · page gutter, field → field</text><rect x="16" y="194" width="80" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="206" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-5</text><text x="270" y="206" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">20px · app bar and action bar x</text><rect x="16" y="222" width="96" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="234" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-6</text><text x="270" y="234" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">24px · pane top padding</text><rect x="16" y="250" width="112" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="262" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-7</text><text x="270" y="262" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">28px · pane sides, pane → aside</text><rect x="16" y="278" width="128" height="16" rx="2" fill="#0062B5" opacity="0.8"/><text x="150" y="290" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-space-8</text><text x="270" y="290" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">32px · large separations</text><text x="560" y="60" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">RADIUS</text><rect x="560" y="74" width="56" height="32" rx="4" fill="#FFFFFF" stroke="#CFD5DD" stroke-width="1"/><text x="630" y="88" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-radius-sm 4px</text><text x="630" y="103" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">inputs, buttons, tables, cards</text><rect x="560" y="118" width="56" height="32" rx="6" fill="#FFFFFF" stroke="#CFD5DD" stroke-width="1"/><text x="630" y="132" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-radius-md 6px</text><text x="630" y="147" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">framed shell</text><rect x="560" y="162" width="56" height="32" rx="10" fill="#FFFFFF" stroke="#CFD5DD" stroke-width="1"/><text x="630" y="176" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-radius-pill 10px</text><text x="630" y="191" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">chips</text><text x="560" y="226" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">ICONS</text><g transform="translate(560,238) scale(1.0)"><circle cx="10" cy="10" r="2.6" fill="none" stroke="#2B2F36" stroke-width="1.6"/><circle cx="10" cy="10" r="6.3" fill="none" stroke="#2B2F36" stroke-width="1.6"/><line x1="16.3" y1="10.0" x2="18.3" y2="10.0" stroke="#2B2F36" stroke-width="2"/><line x1="3.7" y1="10.0" x2="1.6999999999999993" y2="10.0" stroke="#2B2F36" stroke-width="2"/><line x1="10.0" y1="16.3" x2="10.0" y2="18.3" stroke="#2B2F36" stroke-width="2"/><line x1="10.0" y1="3.7" x2="10.0" y2="1.6999999999999993" stroke="#2B2F36" stroke-width="2"/><line x1="14.41" y1="14.41" x2="15.81" y2="15.81" stroke="#2B2F36" stroke-width="2"/><line x1="5.590000000000001" y1="14.41" x2="4.1899999999999995" y2="15.81" stroke="#2B2F36" stroke-width="2"/><line x1="14.41" y1="5.590000000000001" x2="15.81" y2="4.1899999999999995" stroke="#2B2F36" stroke-width="2"/><line x1="5.590000000000001" y1="5.590000000000001" x2="4.1899999999999995" y2="4.1899999999999995" stroke="#2B2F36" stroke-width="2"/></g><text x="588" y="253" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">--ab-icon 20px (default)</text><g transform="translate(780,240) scale(0.8)"><circle cx="10" cy="10" r="2.6" fill="none" stroke="#2B2F36" stroke-width="1.6"/><circle cx="10" cy="10" r="6.3" fill="none" stroke="#2B2F36" stroke-width="1.6"/><line x1="16.3" y1="10.0" x2="18.3" y2="10.0" stroke="#2B2F36" stroke-width="2"/><line x1="3.7" y1="10.0" x2="1.6999999999999993" y2="10.0" stroke="#2B2F36" stroke-width="2"/><line x1="10.0" y1="16.3" x2="10.0" y2="18.3" stroke="#2B2F36" stroke-width="2"/><line x1="10.0" y1="3.7" x2="10.0" y2="1.6999999999999993" stroke="#2B2F36" stroke-width="2"/><line x1="14.41" y1="14.41" x2="15.81" y2="15.81" stroke="#2B2F36" stroke-width="2"/><line x1="5.590000000000001" y1="14.41" x2="4.1899999999999995" y2="15.81" stroke="#2B2F36" stroke-width="2"/><line x1="14.41" y1="5.590000000000001" x2="15.81" y2="4.1899999999999995" stroke="#2B2F36" stroke-width="2"/><line x1="5.590000000000001" y1="5.590000000000001" x2="4.1899999999999995" y2="4.1899999999999995" stroke="#2B2F36" stroke-width="2"/></g><text x="802" y="253" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">--ab-icon-sm 16px</text><text x="560" y="284" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Material Icons (filled). Icons inherit the text colour.</text><text x="560" y="302" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Borders always 1px --ab-line. No shadows except Material overlays.</text>
