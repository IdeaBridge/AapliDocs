<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Admin modal confirmation" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin modal confirmation</title>
<rect width="1040" height="330" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Modal confirmation (app-default-dialog)</text><rect x="16" y="50" width="520" height="260" rx="4" fill="#0F1B2A" opacity="0.32"/><rect x="76" y="80" width="400" height="196" rx="8" fill="#FFFFFF"/><g transform="translate(100,104) scale(1.2)"><path d="M4.5 6 L15.5 6 M8 6 L8.5 4 L11.5 4 L12 6 M6 6 L6.8 16 L13.2 16 L14 6" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="134" y="123" font-size="18" fill="#2B2F36" font-weight="500" text-anchor="start">Delete property?</text><rect x="418" y="98" width="34" height="34" rx="4" fill="none"/><g transform="translate(425,105) scale(1.0)"><path d="M5 5 L15 15 M15 5 L5 15" fill="none" stroke="#5F6670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="100" y="164" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">ReportCode is removed from this application and</text><text x="100" y="185" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">from the API. You can’t undo this.</text><rect x="306.4" y="218" width="145.60000000000002" height="34" rx="4" fill="#C62828"/><text x="320.4" y="240.04" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="start">Delete property</text><rect x="223.35999999999996" y="218" width="75.04" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="237.35999999999996" y="240.04" font-size="14" fill="#0062B5" font-weight="500" text-anchor="start">Cancel</text><line x1="64" y1="80" x2="64" y2="104" stroke="#7A3E9D" stroke-width="1"/><text x="60" y="96.0" font-size="10.5" fill="#7A3E9D" font-weight="500" text-anchor="end">24</text><line x1="64" y1="132" x2="64" y2="148" stroke="#7A3E9D" stroke-width="1"/><text x="60" y="144.0" font-size="10.5" fill="#7A3E9D" font-weight="500" text-anchor="end">16</text><line x1="64" y1="192" x2="64" y2="218" stroke="#7A3E9D" stroke-width="1"/><text x="60" y="209.0" font-size="10.5" fill="#7A3E9D" font-weight="500" text-anchor="end">24</text><text x="302.4" y="270" font-size="10.5" fill="#7A3E9D" font-weight="500" text-anchor="middle">8</text><rect x="570" y="50" width="454" height="260" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="586" y="74" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Spec</text><text x="586" y="98" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Heading 18 / 500, line 24 · body 14 / 400, line 21</text><text x="586" y="117" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Padding 24 · heading → body 16 · body → actions 24</text><text x="586" y="136" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Buttons right aligned, 8 apart: Cancel (stroked),</text><text x="586" y="155" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">then primary or danger-solid repeating the verb</text><text x="586" y="174" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Optional 24px status icon; optional round close</text><text x="586" y="193" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Width small 20vw · medium 40vw (default) · large 60vw</text><text x="586" y="212" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">x-large 80vw · min 360px · full width ≤ 768px</text><text x="586" y="250" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Body: what happens and whether it can be undone.</text><text x="586" y="269" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Longer than a short form → right panel, not a modal.</text>
</svg>
