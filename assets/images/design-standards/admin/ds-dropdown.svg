<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-label="Admin dropdown" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin dropdown</title>
<rect width="1040" height="410" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Dropdown (select.ab-input and mat-select)</text><text x="16" y="58" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Closed</text><text x="16" y="86" font-size="12" fill="#2B2F36" font-weight="500">Category<tspan fill="#C62828"> *</tspan></text><rect x="16" y="92" width="230" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="25" y="114.0" font-size="14" fill="#8A919B" font-weight="400" text-anchor="start">Select a category</text><g transform="translate(219,99.0) scale(1.0)"><path d="M5 8 L10 13 L15 8" fill="none" stroke="#5F6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="16" y="148" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Selected</text><text x="16" y="176" font-size="12" fill="#2B2F36" font-weight="500">Category<tspan fill="#C62828"> *</tspan></text><rect x="16" y="182" width="230" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="25" y="204.0" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Sustainability</text><g transform="translate(219,189.0) scale(1.0)"><path d="M5 8 L10 13 L15 8" fill="none" stroke="#5F6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="16" y="238" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Invalid</text><text x="16" y="266" font-size="12" fill="#2B2F36" font-weight="500">Category<tspan fill="#C62828"> *</tspan></text><rect x="16" y="272" width="230" height="34" rx="4" fill="#FBEDED" stroke="#C62828" stroke-width="1"/><text x="25" y="294.0" font-size="14" fill="#8A919B" font-weight="400" text-anchor="start">Select a category</text><g transform="translate(219,279.0) scale(1.0)"><path d="M5 8 L10 13 L15 8" fill="none" stroke="#5F6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="16" y="322" font-size="12" fill="#C62828" font-weight="400" text-anchor="start">Choose a category.</text><text x="290" y="58" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Open list (mat-select)</text><text x="290" y="86" font-size="12" fill="#2B2F36" font-weight="500">Date format</text><rect x="290" y="92" width="230" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="299" y="114.0" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">DD/MM/YYYY</text><g transform="translate(493,99.0) scale(1.0)"><path d="M5 8 L10 13 L15 8" fill="none" stroke="#5F6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="290" y="132" width="230" height="156" rx="4" fill="#000" opacity=".06" transform="translate(0,3)"/><rect x="290" y="132" width="230" height="156" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><rect x="291" y="138" width="228" height="36" rx="0" fill="#E6EFF8"/><text x="304" y="161" font-size="13" fill="#0062B5" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">DD/MM/YYYY</text><text x="304" y="197" font-size="13" fill="#2B2F36" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">MM/DD/YYYY</text><rect x="291" y="210" width="228" height="36" rx="0" fill="#F8F8F8"/><text x="304" y="233" font-size="13" fill="#2B2F36" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">YYYY-MM-DD</text><text x="304" y="269" font-size="13" fill="#2B2F36" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">D MMM YYYY</text><text x="528" y="161" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">← selected</text><text x="528" y="233" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">← hover</text><text x="600" y="58" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Radio instead (2–5 visible options)</text><text x="600" y="96" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Who can use AI chat</text><circle cx="609" cy="117" r="8.5" fill="#FFFFFF" stroke="#0062B5" stroke-width="2"/><circle cx="609" cy="117" r="4.5" fill="#0062B5"/><text x="628" y="122" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Everyone</text><circle cx="609" cy="147" r="8.5" fill="#FFFFFF" stroke="#5F6670" stroke-width="2"/><text x="628" y="152" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">People with the AI Assistant role</text><rect x="600" y="188" width="424" height="204" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="616" y="212" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Rules</text><text x="616" y="234" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">select.ab-input draws its own chevron. mat-select is fine where it</text><text x="616" y="253" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">exists: 36px, white, 1px line-strong border, no fill, no underline.</text><text x="616" y="272" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Put the label above (.ab-label); a floating label overlaps at 36px.</text><text x="616" y="291" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Open lists: white, 1px border, soft shadow, panelClass=&quot;ab-theme&quot;.</text><text x="616" y="310" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">More than 5 options → select. 2–5 that should all be seen → radio.</text><text x="616" y="329" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Placeholder “Select a category”, never a default that looks chosen.</text><text x="616" y="348" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Options sort A→Z unless the order means something (keepOrder).</text>
</svg>
