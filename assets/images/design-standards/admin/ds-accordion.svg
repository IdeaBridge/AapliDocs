<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="220" viewBox="0 0 1040 220" role="img" aria-label="Admin accordions" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin accordions</title>
<rect width="1040" height="220" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Accordions (cdk-accordion)</text><rect x="16" y="50" width="300" height="150" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="30" y="74" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">BASIC FIELDS</text><g transform="translate(286,60) scale(0.9)"><path d="M5 12 L10 7 L15 12" fill="none" stroke="#5F6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="30" y="86" width="272" height="22" rx="4" fill="#F8F8F8"/><text x="40" y="101" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">Single line input</text><rect x="30" y="112" width="272" height="22" rx="4" fill="#F8F8F8"/><text x="40" y="127" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">Paragraph</text><line x1="16" y1="146" x2="316" y2="146" stroke="#E2E6EC" stroke-width="1"/><text x="30" y="170" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">ADVANCED FIELDS</text><g transform="translate(286,156) scale(0.9)"><path d="M5 8 L10 13 L15 8" fill="none" stroke="#5F6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="360" y="70" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">Every group starts expanded ([multi]=&quot;true&quot;, [expanded]=&quot;true&quot;); people collapse what they don’t need.</text><text x="360" y="92" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">Header: 11 / 500 caps .06em, muted, with a chevron; the header is a real button.</text><text x="360" y="114" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">No hover background on the header; focus still shows the ring.</text><text x="360" y="136" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">Used in the form builder and entity builder palettes and property columns.</text>
</svg>
