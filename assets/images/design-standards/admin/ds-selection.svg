<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="270" viewBox="0 0 1040 270" role="img" aria-label="Admin selection controls" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin selection controls</title>
<rect width="1040" height="270" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Selection controls</text><text x="16" y="64" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Checkbox</text><rect x="16" y="78" width="18" height="18" rx="2" fill="#FFFFFF" stroke="#5F6670" stroke-width="2"/><text x="44" y="92" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Off</text><rect x="16" y="110" width="18" height="18" rx="2" fill="#0062B5" stroke="#0062B5" stroke-width="2"/><g transform="translate(17,111) scale(0.8)"><path d="M4 10.5 L8 14.5 L16 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="44" y="124" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">On</text><rect x="16" y="142" width="18" height="18" rx="2" fill="#0062B5" stroke="#0062B5" stroke-width="2"/><line x1="21" y1="151" x2="29" y2="151" stroke="#fff" stroke-width="2"/><text x="44" y="156" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Some (select all)</text><circle cx="199" cy="87" r="16" fill="#D6E6F4"/><rect x="190" y="78" width="18" height="18" rx="2" fill="#0062B5" stroke="#0062B5" stroke-width="2"/><g transform="translate(191,79) scale(0.8)"><path d="M4 10.5 L8 14.5 L16 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="218" y="92" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Focus</text><rect x="190" y="110" width="18" height="18" rx="2" fill="#F8F8F8" stroke="#CFD5DD" stroke-width="2"/><text x="218" y="124" font-size="14" fill="#8A919B" font-weight="400" text-anchor="start">Disabled</text><text x="16" y="196" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Independent options; opting a card in or out.</text><text x="380" y="64" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Radio</text><circle cx="389" cy="87" r="8.5" fill="#FFFFFF" stroke="#0062B5" stroke-width="2"/><circle cx="389" cy="87" r="4.5" fill="#0062B5"/><text x="408" y="92" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Everyone</text><circle cx="389" cy="119" r="8.5" fill="#FFFFFF" stroke="#5F6670" stroke-width="2"/><text x="408" y="124" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Selected roles</text><circle cx="389" cy="151" r="8.5" fill="#FFFFFF" stroke="#CFD5DD" stroke-width="2"/><text x="408" y="156" font-size="14" fill="#8A919B" font-weight="400" text-anchor="start">Nobody</text><text x="380" y="196" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">2–5 mutually exclusive options, all visible.</text><text x="700" y="64" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Slide toggle</text><rect x="700" y="81" width="34" height="14" rx="7" fill="#D6E6F4"/><circle cx="725" cy="88" r="9" fill="#0062B5"/><text x="746" y="93" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Show judging summary</text><rect x="700" y="117" width="34" height="14" rx="7" fill="#C9CED6"/><circle cx="709" cy="124" r="9" fill="#FFFFFF" stroke="#CFD5DD" stroke-width="1"/><text x="746" y="129" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Allow comments</text><text x="700" y="166" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Only for a setting that takes effect at once.</text><text x="700" y="184" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">If the page has Save, use a checkbox.</text><text x="16" y="228" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Angular Material mat-checkbox, mat-radio-button, mat-slide-toggle. Label on the right, sentence case, says what “on” means.</text><text x="16" y="246" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Checked = --ab-primary, unchecked outline = --ab-muted.</text>
</svg>
