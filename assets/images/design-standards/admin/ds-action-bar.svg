<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-label="Admin action bar and saving" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin action bar and saving</title>
<rect width="1040" height="300" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Action bar and saving</text><text x="16" y="64" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Sticky (.ab-actionbar--sticky) — multi-tab workspaces</text><rect x="16" y="76" width="1008" height="60" rx="0" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><rect x="36" y="89" width="59.36" height="34" rx="4" fill="none"/><text x="50" y="111.04" font-size="14" fill="#5F6670" font-weight="500" text-anchor="start">Back</text><rect x="918.64" y="89" width="85.36" height="34" rx="4" fill="#0062B5"/><g transform="translate(932.64,96.0) scale(1.0)"><rect x="3.5" y="3.5" width="13" height="13" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.7"/><rect x="6.5" y="3.5" width="7" height="4.5" rx="0" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="10" cy="12" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></g><text x="958.64" y="111.04" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="start">Save</text><rect x="851.28" y="89" width="59.36" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="865.28" y="111.04" font-size="14" fill="#0062B5" font-weight="500" text-anchor="start">Next</text><rect x="697.68" y="89" width="145.60000000000002" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="711.68" y="111.04" font-size="14" fill="#0062B5" font-weight="500" text-anchor="start">Discard changes</text><text x="685.68" y="111" font-size="12" fill="#5F6670" font-weight="400" text-anchor="end">Unsaved changes</text><text x="16" y="170" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Status text (.ab-status) beside the buttons</text><g opacity="0.45"><rect x="16" y="184" width="85.36" height="34" rx="4" fill="#0062B5"/><g transform="translate(30,191.0) scale(1.0)"><rect x="3.5" y="3.5" width="13" height="13" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.7"/><rect x="6.5" y="3.5" width="7" height="4.5" rx="0" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="10" cy="12" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></g><text x="56" y="206.04" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="start">Save</text></g><text x="113.36" y="206" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">All changes saved</text><rect x="16" y="222" width="85.36" height="34" rx="4" fill="#0062B5"/><g transform="translate(30,229.0) scale(1.0)"><rect x="3.5" y="3.5" width="13" height="13" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.7"/><rect x="6.5" y="3.5" width="7" height="4.5" rx="0" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="10" cy="12" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></g><text x="56" y="244.04" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="start">Save</text><text x="113.36" y="244" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Unsaved changes</text><g opacity="0.45"><rect x="16" y="260" width="85.36" height="34" rx="4" fill="#0062B5"/><g transform="translate(30,267.0) scale(1.0)"><rect x="3.5" y="3.5" width="13" height="13" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.7"/><rect x="6.5" y="3.5" width="7" height="4.5" rx="0" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="10" cy="12" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></g><text x="56" y="282.04" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="start">Save</text></g><text x="113.36" y="282" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">2 rows need fixing before you can save</text><rect x="560" y="170" width="464" height="112" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="576" y="194" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Order: Back far left → spacer → Cancel / Discard → Next →</text><text x="576" y="213" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Save last, far right. Exactly one primary.</text><text x="576" y="232" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Inline variant (.ab-actionbar--inline): under a single form, 18px above.</text><text x="576" y="251" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Leaving with unsaved changes asks first (canDeactivate).</text><text x="576" y="270" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">After saving: toast, and previews update from saved data.</text>
</svg>
