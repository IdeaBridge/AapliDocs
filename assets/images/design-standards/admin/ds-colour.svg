rt" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-line-strong</text><text x="56" y="251" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#CFD5DD · Hover border</text><text x="16" y="280" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">TEXT</text><rect x="16" y="292" width="30" height="30" rx="4" fill="#2B2F36" stroke="#E2E6EC" stroke-width="1"/><text x="56" y="305" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-fg</text><text x="56" y="319" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#2B2F36 · Body text, headings · 13.4:1</text><rect x="16" y="330" width="30" height="30" rx="4" fill="#5F6670" stroke="#E2E6EC" stroke-width="1"/><text x="56" y="343" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-muted</text><text x="56" y="357" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#5F6670 · Secondary, hints · 5.8:1</text><rect x="16" y="368" width="30" height="30" rx="4" fill="#8A919B" stroke="#E2E6EC" stroke-width="1"/><text x="56" y="381" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-placeholder</text><text x="56" y="395" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#8A919B · Placeholders only</text><text x="360" y="60" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">BRAND</text><rect x="360" y="72" width="30" height="30" rx="4" fill="#0062B5" stroke="#E2E6EC" stroke-width="1"/><text x="400" y="85" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-primary</text><text x="400" y="99" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#0062B5 · Primary, active, focus · 6.2:1</text><rect x="360" y="110" width="30" height="30" rx="4" fill="#00539A" stroke="#E2E6EC" stroke-width="1"/><text x="400" y="123" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-primary-hover</text><text x="400" y="137" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#00539A · Primary button hover</text><rect x="360" y="148" width="30" height="30" rx="4" fill="#E6EFF8" stroke="#E2E6EC" stroke-width="1"/><text x="400" y="161" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-primary-tint</text><text x="400" y="175" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#E6EFF8 · rgba(0,98,181,.10) active fill</text><rect x="360" y="186" width="30" height="30" rx="4" fill="#D6E6F4" stroke="#E2E6EC" stroke-width="1"/><text x="400" y="199" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-primary-tint-strong</text><text x="400" y="213" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#D6E6F4 · rgba(0,98,181,.16) pressed</text><text x="360" y="242" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">STATE</text><rect x="360" y="254" width="30" height="30" rx="4" fill="#C62828" stroke="#E2E6EC" stroke-width="1"/><text x="400" y="267" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-danger</text><text x="400" y="281" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#C62828 · Errors, destructive</text><rect x="360" y="292" width="30" height="30" rx="4" fill="#2E7D32" stroke="#E2E6EC" stroke-width="1"/><text x="400" y="305" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-ok</text><text x="400" y="319" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#2E7D32 · Success, “on”</text><rect x="360" y="330" width="30" height="30" rx="4" fill="#8A5300" stroke="#E2E6EC" stroke-width="1"/><text x="400" y="343" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-warn</text><text x="400" y="357" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#8A5300 · Warnings that don’t block</text><text x="704" y="60" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">CODE</text><rect x="704" y="72" width="30" height="30" rx="4" fill="#0F1B2A" stroke="#E2E6EC" stroke-width="1"/><text x="744" y="85" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-code-bg</text><text x="744" y="99" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#0F1B2A · Code block background</text><rect x="704" y="110" width="30" height="30" rx="4" fill="#7CC4FF" stroke="#E2E6EC" stroke-width="1"/><text x="744" y="123" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-code-key</text><text x="744" y="137" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#7CC4FF · Keys</text><rect x="704" y="148" width="30" height="30" rx="4" fill="#A5D6A7" stroke="#E2E6EC" stroke-width="1"/><text x="744" y="161" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-code-str</text><text x="744" y="175" font-size="11" fill="#5F6670" font-weight="400" text-anchor="start">#A5D6A7 · Strings</text><rect x="704" y="260" width="320" height="190" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="720" y="284" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Rules</text><text x="720" y="306" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Admin blue is fixed: it never takes the</text><text x="720" y="324" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">tenant colour. Inside .ab-theme the legacy</text><text x="720" y="342" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">--primaryColor points at --ab-primary.</text><text x="720" y="378" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Text on surface uses fg or muted only.</text><text x="720" y="396" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Status is never colour alone: add text.</text><text x="720" y="414" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Tints are backgrounds, never text colours.</text>
</svg>
