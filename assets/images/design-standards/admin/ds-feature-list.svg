<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-label="Admin feature list" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin feature list</title>
<rect width="1040" height="450" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Feature list</text><text x="16" y="66" font-size="17" fill="#2B2F36" font-weight="500" text-anchor="start">Features</text><text x="16" y="90" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">Turn features on or off for your organisation. Select a feature to see what it does.</text><rect x="16" y="108" width="320" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><g transform="translate(24,115.0) scale(1.0)"><circle cx="8.5" cy="8.5" r="5.2" fill="none" stroke="#5F6670" stroke-width="1.8"/><path d="M12.5 12.5 L17 17" fill="none" stroke="#5F6670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="51" y="130.0" font-size="14" fill="#8A919B" font-weight="400" text-anchor="start">Search features</text><text x="348" y="130" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">24 features</text><rect x="16" y="154" width="700" height="252" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><rect x="16" y="154" width="700" height="36" rx="0" fill="#F8F8F8"/><text x="28" y="177" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">NAME</text><text x="266" y="177" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">DESCRIPTION</text><text x="704" y="177" font-size="11" fill="#5F6670" font-weight="500" text-anchor="end" letter-spacing="0.66">STATUS</text><rect x="17" y="190" width="698" height="30" rx="0" fill="#F4F6F9"/><line x1="16" y1="190" x2="716" y2="190" stroke="#E2E6EC" stroke-width="1"/><text x="28" y="210" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">AUTHENTICATION AND ACCESS</text><line x1="16" y1="220" x2="716" y2="220" stroke="#E2E6EC" stroke-width="1"/><rect x="28" y="230" width="32" height="32" rx="4" fill="#E6EFF8"/><g transform="translate(34.0,236.0) scale(1.0)"><circle cx="6.5" cy="10" r="3.2" fill="none" stroke="#0062B5" stroke-width="1.6"/><path d="M9.7 10 L17 10 M14 10 L14 13 M16.5 10 L16.5 12.5" fill="none" stroke="#0062B5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="251" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Sign-in methods</text><text x="266" y="251" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">Choose how people sign in.</text><rect x="652" y="236" width="28.8" height="20" rx="10" fill="#EAF2EA"/><text x="660" y="250" font-size="12" fill="#2E7D32" font-weight="400" text-anchor="start">On</text><line x1="16" y1="272" x2="716" y2="272" stroke="#E2E6EC" stroke-width="1"/><rect x="28" y="282" width="32" height="32" rx="4" fill="#E6EFF8"/><g transform="translate(34.0,288.0) scale(1.0)"><rect x="5" y="9" width="10" height="8" rx="1.5" fill="none" stroke="#0062B5" stroke-width="1.6"/><path d="M7 9 L7 6.5 Q10 2.5 13 6.5 L13 9" fill="none" stroke="#0062B5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="303" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Single session</text><text x="266" y="303" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">Allow one device at a time.</text><rect x="654" y="288" width="35.2" height="20" rx="10" fill="#F8F8F8" stroke="#E2E6EC" stroke-width="1"/><text x="662" y="302" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Off</text><rect x="17" y="324" width="698" height="30" rx="0" fill="#F4F6F9"/><line x1="16" y1="324" x2="716" y2="324" stroke="#E2E6EC" stroke-width="1"/><text x="28" y="344" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">AI</text><rect x="17" y="354" width="698" height="52" rx="0" fill="#E6EFF8"/><line x1="16" y1="354" x2="716" y2="354" stroke="#E2E6EC" stroke-width="1"/><rect x="28" y="364" width="32" height="32" rx="4" fill="#E6EFF8"/><g transform="translate(34.0,370.0) scale(1.0)"><path d="M3.5 4.5 L16.5 4.5 L16.5 13 L8 13 L4.5 16 L4.5 13 L3.5 13 Z" fill="none" stroke="#0062B5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="385" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">AI chat</text><text x="266" y="385" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">Let people ask questions in a chat panel.</text><rect x="652" y="370" width="28.8" height="20" rx="10" fill="#EAF2EA"/><text x="660" y="384" font-size="12" fill="#2E7D32" font-weight="400" text-anchor="start">On</text><circle cx="750" cy="64" r="10" fill="#7A3E9D"/><text x="750" y="68" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="768" y="68" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Group row</text><text x="768" y="85" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">overline on --ab-bg; hidden with no matches</text><circle cx="750" cy="120" r="10" fill="#7A3E9D"/><text x="750" y="124" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="768" y="124" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Name cell</text><text x="768" y="141" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">32px icon tile + name 14 / 500</text><text x="768" y="157" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">&lt;button aria-expanded aria-controls&gt;</text><circle cx="750" cy="182" r="10" fill="#7A3E9D"/><text x="750" y="186" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="768" y="186" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Description</text><text x="768" y="203" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">13px muted, one line, ellipsis</text><circle cx="750" cy="238" r="10" fill="#7A3E9D"/><text x="750" y="242" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="768" y="242" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Status</text><text x="768" y="259" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">“On” ok / “Off” neutral; text, not colour</text><circle cx="750" cy="294" r="10" fill="#7A3E9D"/><text x="750" y="298" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="768" y="298" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Open row</text><text x="768" y="315" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">--ab-primary-tint while its panel is open</text><circle cx="692" cy="205" r="10" fill="#7A3E9D"/><text x="692" y="209" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="106" cy="172" r="10" fill="#7A3E9D"/><text x="106" y="176" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="382" cy="172" r="10" fill="#7A3E9D"/><text x="382" y="176" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="646" cy="172" r="10" fill="#7A3E9D"/><text x="646" y="176" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="626" cy="404" r="10" fill="#7A3E9D"/><text x="626" y="408" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="16" y="434" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">The list never changes a setting by itself: no switches in rows. Everything happens in the panel and is committed with Save.</text>
</svg>
