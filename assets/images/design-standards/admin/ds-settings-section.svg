<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="Admin settings section view and edit" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin settings section view and edit</title>
<rect width="1040" height="420" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Settings section (.ab-section): view and edit</text><rect x="16" y="50" width="490" height="190" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="36" y="80" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Company address</text><rect x="416" y="62" width="68.88" height="28" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><g transform="translate(426,68.0) scale(0.8)"><path d="M4 16 L4.5 12.5 L13 4 L16 7 L7.5 15.5 Z" fill="none" stroke="#0062B5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="448" y="80.32" font-size="12" fill="#0062B5" font-weight="500" text-anchor="start">Edit</text><text x="36" y="110" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Street address</text><text x="36" y="128" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">12 Market Lane</text><text x="266" y="110" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Town or city</text><text x="266" y="128" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Leeds</text><text x="36" y="150" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">County or state</text><text x="36" y="168" font-size="14" fill="#8A919B" font-weight="400" text-anchor="start">Not set</text><text x="266" y="150" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Postcode</text><text x="266" y="168" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">LS1 4AB</text><text x="36" y="190" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Country</text><text x="36" y="208" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">United Kingdom</text><text x="266" y="190" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Phone</text><text x="266" y="208" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">+44 113 496 0000</text><text x="16" y="264" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">View: every value the form can change, read only. Empty = “Not set”.</text><rect x="530" y="50" width="494" height="290" rx="4" fill="#FFFFFF" stroke="#0062B5" stroke-width="1"/><rect x="530" y="50" width="3" height="290" rx="0" fill="#0062B5"/><text x="550" y="80" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Company address</text><text x="550" y="110" font-size="12" fill="#2B2F36" font-weight="500">Street address<tspan fill="#C62828"> *</tspan></text><rect x="550" y="116" width="220" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="559" y="138.0" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">12 Market Lane</text><text x="784" y="110" font-size="12" fill="#2B2F36" font-weight="500">Town or city</text><rect x="784" y="116" width="220" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="793" y="138.0" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Leeds</text><text x="550" y="174" font-size="12" fill="#2B2F36" font-weight="500">Postcode<tspan fill="#C62828"> *</tspan></text><rect x="550" y="180" width="220" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="559" y="202.0" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">LS1</text><text x="550" y="230" font-size="12" fill="#C62828" font-weight="400" text-anchor="start">Enter a full postcode.</text><text x="784" y="174" font-size="12" fill="#2B2F36" font-weight="500">Country</text><rect x="784" y="180" width="220" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="793" y="202.0" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">United Kingdom</text><g transform="translate(977,187.0) scale(1.0)"><path d="M5 8 L10 13 L15 8" fill="none" stroke="#5F6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="550" y="272" width="75.04" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="564" y="294.04" font-size="14" fill="#0062B5" font-weight="500" text-anchor="start">Cancel</text><g opacity="0.45"><rect x="633.04" y="272" width="85.36" height="34" rx="4" fill="#0062B5"/><g transform="translate(647.04,279.0) scale(1.0)"><rect x="3.5" y="3.5" width="13" height="13" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.7"/><rect x="6.5" y="3.5" width="7" height="4.5" rx="0" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="10" cy="12" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></g><text x="673.04" y="294.04" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="start">Save</text></g><text x="723.04" y="294" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Fix the highlighted fields to save.</text><text x="530" y="364" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Edit: primary border + 3px bar, two-column .ab-form-grid, inline action bar.</text><text x="16" y="386" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Card 16px 20px, max 960px, 16px apart. Each section saves on its own; one in edit at a time. Values: dl.ab-dl, dt 12px muted, dd 14px. Machine values in mono.</text>
</svg>
