<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="270" viewBox="0 0 1040 270" role="img" aria-label="Admin tabs" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin tabs</title>
<rect width="1040" height="270" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Main tabs and in-page tabs</text><rect x="16" y="56" width="640" height="60" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><g transform="translate(42,76) scale(1.0)"><circle cx="10" cy="10" r="2.6" fill="none" stroke="#0062B5" stroke-width="1.6"/><circle cx="10" cy="10" r="6.3" fill="none" stroke="#0062B5" stroke-width="1.6"/><line x1="16.3" y1="10.0" x2="18.3" y2="10.0" stroke="#0062B5" stroke-width="2"/><line x1="3.7" y1="10.0" x2="1.6999999999999993" y2="10.0" stroke="#0062B5" stroke-width="2"/><line x1="10.0" y1="16.3" x2="10.0" y2="18.3" stroke="#0062B5" stroke-width="2"/><line x1="10.0" y1="3.7" x2="10.0" y2="1.6999999999999993" stroke="#0062B5" stroke-width="2"/><line x1="14.41" y1="14.41" x2="15.81" y2="15.81" stroke="#0062B5" stroke-width="2"/><line x1="5.590000000000001" y1="14.41" x2="4.1899999999999995" y2="15.81" stroke="#0062B5" stroke-width="2"/><line x1="14.41" y1="5.590000000000001" x2="15.81" y2="4.1899999999999995" stroke="#0062B5" stroke-width="2"/><line x1="5.590000000000001" y1="5.590000000000001" x2="4.1899999999999995" y2="4.1899999999999995" stroke="#0062B5" stroke-width="2"/></g><text x="70" y="91" font-size="14" fill="#0062B5" font-weight="500" text-anchor="start">Settings</text><rect x="28" y="112" width="118.72" height="2" rx="0" fill="#0062B5"/><g transform="translate(164.72,76) scale(1.0)"><path d="M4 16 L4.5 12.5 L13 4 L16 7 L7.5 15.5 Z M11 6 L14 9" fill="none" stroke="#5F6670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="192.72" y="91" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">Form</text><circle cx="232.4" cy="86" r="3" fill="#C62828"/><g transform="translate(270.08,76) scale(1.0)"><rect x="3" y="3" width="5" height="4" rx="1" fill="none" stroke="#2B2F36" stroke-width="1.4"/><rect x="12" y="9" width="5" height="4" rx="1" fill="none" stroke="#2B2F36" stroke-width="1.4"/><rect x="12" y="14.5" width="5" height="3.5" rx="1" fill="none" stroke="#2B2F36" stroke-width="1.4"/><path d="M5.5 7 L5.5 16 L12 16 M5.5 11 L12 11" fill="none" stroke="#2B2F36" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="298.08" y="91" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Request workflow</text><g transform="translate(455.52,76) scale(1.0)"><rect x="4" y="3.5" width="12" height="14" rx="1.5" fill="none" stroke="#5F6670" stroke-width="1.5"/><path d="M7 8 L13 8 M7 11 L13 11 M7 14 L11 14" fill="none" stroke="#5F6670" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="483.52" y="91" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">Tasks</text><line x1="16" y1="114" x2="656" y2="114" stroke="#E2E6EC" stroke-width="1"/><line x1="76" y1="113" x2="76" y2="148" stroke="#7A3E9D" stroke-width="1" stroke-dasharray="3 2"/><circle cx="76" cy="113" r="2.5" fill="#7A3E9D"/><circle cx="76" cy="148" r="10" fill="#7A3E9D"/><text x="76" y="152" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><line x1="226" y1="86" x2="226" y2="148" stroke="#7A3E9D" stroke-width="1" stroke-dasharray="3 2"/><circle cx="226" cy="86" r="2.5" fill="#7A3E9D"/><circle cx="226" cy="148" r="10" fill="#7A3E9D"/><text x="226" y="152" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><line x1="336" y1="92" x2="346" y2="148" stroke="#7A3E9D" stroke-width="1" stroke-dasharray="3 2"/><circle cx="336" cy="92" r="2.5" fill="#7A3E9D"/><circle cx="346" cy="148" r="10" fill="#7A3E9D"/><text x="346" y="152" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="690" cy="66" r="10" fill="#7A3E9D"/><text x="690" y="70" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="708" y="70" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Active</text><text x="708" y="87" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">primary text + 2px underline, 500</text><circle cx="690" cy="114" r="10" fill="#7A3E9D"/><text x="690" y="118" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="708" y="118" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Has an error</text><text x="708" y="135" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">6px danger dot; reason inside the tab</text><circle cx="690" cy="162" r="10" fill="#7A3E9D"/><text x="690" y="166" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="708" y="166" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Hover</text><text x="708" y="183" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">fg text</text><text x="16" y="190" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">Padding 12px 14px · icon 20px + label · bottom border · scrolls, never wraps · 3–8 tabs.</text><text x="16" y="210" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">Material: &lt;mat-tab-group class=&quot;ab-mat-tabs&quot; animationDuration=&quot;0ms&quot; [stretchTabs]=&quot;false&quot; disableRipple&gt;.</text><text x="16" y="230" font-size="12.5" fill="#2B2F36" font-weight="400" text-anchor="start">In-page tabs (third level) use the same look but are links: &lt;a class=&quot;ab-tab&quot; routerLink routerLinkActive=&quot;is-active&quot;&gt;.</text>
</svg>
