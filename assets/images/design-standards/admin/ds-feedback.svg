<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Admin feedback states" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin feedback states</title>
<rect width="1040" height="330" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Toast, empty, loading and error</text><rect x="16" y="66" width="240" height="170" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="16" y="56" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Empty (.ab-empty)</text><text x="136" y="142" font-size="14" fill="#5F6670" font-weight="400" text-anchor="middle">No users yet.</text><text x="136" y="162" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle">Select Add user to invite someone.</text><rect x="272" y="66" width="240" height="170" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="272" y="56" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Loading</text><rect x="273" y="67" width="238" height="2" rx="0" fill="#D6E6F4"/><rect x="273" y="67" width="90" height="2" rx="0" fill="#0062B5"/><rect x="288" y="90" width="120" height="12" rx="3" fill="#F8F8F8"/><rect x="420" y="90" width="70" height="12" rx="6" fill="#F8F8F8"/><rect x="288" y="120" width="120" height="12" rx="3" fill="#F8F8F8"/><rect x="420" y="120" width="70" height="12" rx="6" fill="#F8F8F8"/><rect x="288" y="150" width="120" height="12" rx="3" fill="#F8F8F8"/><rect x="420" y="150" width="70" height="12" rx="6" fill="#F8F8F8"/><rect x="288" y="180" width="120" height="12" rx="3" fill="#F8F8F8"/><rect x="420" y="180" width="70" height="12" rx="6" fill="#F8F8F8"/><text x="392" y="256" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="middle">Skeletons first load · 2px bar on refresh</text><rect x="528" y="66" width="240" height="170" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="528" y="56" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Error loading</text><rect x="544" y="82" width="208" height="92" rx="4" fill="#FBEDED" stroke="#E2E6EC" stroke-width="1"/><rect x="544" y="82" width="3" height="92" rx="0" fill="#C62828"/><text x="558" y="108" font-size="13" fill="#2B2F36" font-weight="500" text-anchor="start">We couldn’t load users.</text><text x="558" y="128" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Check your connection.</text><rect x="558" y="138" width="80.48" height="28" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="568" y="156.32" font-size="12" fill="#0062B5" font-weight="500" text-anchor="start">Try again</text><text x="784" y="56" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Toast (.ab-toast)</text><rect x="784" y="70" width="240" height="42" rx="4" fill="#2B2F36"/><g transform="translate(798,82) scale(0.9)"><circle cx="10" cy="10" r="8" fill="#7FC383"/><path d="M6 10.3 L8.8 13 L14 7.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="824" y="96" font-size="13" fill="#fff" font-weight="400" text-anchor="start">Custom properties saved.</text><rect x="784" y="124" width="240" height="42" rx="4" fill="#C62828"/><text x="800" y="150" font-size="13" fill="#fff" font-weight="400" text-anchor="start">We couldn’t save. Try again.</text><g transform="translate(998,137) scale(0.8)"><path d="M5 5 L15 15 M15 5 L5 15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="784" y="190" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">Bottom centre, 20px up · ~2.2s</text><text x="784" y="207" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">Errors stay until dismissed</text><text x="784" y="224" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">Past tense, full stop, no “!”</text><text x="16" y="312" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">No spinner for waits under 250ms. Inline 18px spinner in the Save button; 44px overlay only for full-panel waits.</text>
</svg>
