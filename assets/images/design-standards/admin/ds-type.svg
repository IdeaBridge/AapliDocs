<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Admin type scale" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin type scale</title>
<rect width="1040" height="330" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Type scale</text><text x="16" y="66" font-size="18" fill="#2B2F36" font-weight="500" text-anchor="start">Workspace title</text><text x="360" y="66" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-text-page · 18 / 500 · app bar h1</text><text x="16" y="98" font-size="17" fill="#2B2F36" font-weight="500" text-anchor="start">Admin page title</text><text x="360" y="98" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-text-section · 17 / 500 · h2.ab-title</text><text x="16" y="130" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Body and description</text><text x="360" y="130" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-text-body · 14 / 400 · line height 1.5</text><text x="16" y="162" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Sub-heading</text><text x="360" y="162" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">.ab-subtitle · 14 / 500</text><text x="16" y="194" font-size="13" fill="#2B2F36" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">ExportToIFTab</text><text x="360" y="194" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-text-mono · 13 · keys, IDs, expressions</text><text x="16" y="226" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Hints, errors, counts, chips</text><text x="360" y="226" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-text-sm · 12 / 400</text><text x="16" y="258" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">OVERLINE · TABLE HEADERS</text><text x="360" y="258" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">--ab-text-overline · 11 / 500 · caps .06em</text><rect x="16" y="279" width="52" height="15" rx="7.5" fill="#0062B5"/><text x="42" y="289" font-size="10" fill="#fff" font-weight="500" text-anchor="middle" letter-spacing="0.6">NEW</text><text x="360" y="290" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">10 / 500 · caps · primary fill</text><rect x="760" y="50" width="264" height="250" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="776" y="74" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Rules</text><text x="776" y="96" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">500 is the only emphasis weight.</text><text x="776" y="114" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">700 only inside prose (&lt;b&gt; in notes).</text><text x="776" y="132" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Never 300 or 100.</text><text x="776" y="168" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Sentence case everywhere.</text><text x="776" y="186" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Headings: text-wrap: balance.</text><text x="776" y="222" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Mono only for machine values.</text><text x="776" y="258" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Roboto + Roboto Mono, loaded</text><text x="776" y="276" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">in src/index.html.</text>
</svg>
