<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Panel widths and variants</text><rect x="16" y="52" width="240" height="170" rx="4" fill="#F8F8F8" stroke="#E2E6EC" stroke-width="1"/><rect x="136" y="52" width="120" height="170" rx="0" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><rect x="137" y="52" width="119" height="34" rx="0" fill="#E6EFF8"/><rect x="146" y="64" width="50" height="8" rx="2" fill="#2B2F36"/><rect x="146" y="100" width="100" height="10" rx="2" fill="#F8F8F8"/><rect x="146" y="122" width="100" height="10" rx="2" fill="#F8F8F8"/><rect x="146" y="144" width="100" height="10" rx="2" fill="#F8F8F8"/><rect x="146" y="196" width="30" height="16" rx="3" fill="#0062B5"/><rect x="182" y="196" width="34" height="16" rx="3" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="16" y="244" font-size="13" fill="#2B2F36" font-weight="500" text-anchor="start">.ab-panel · 520px</text><text x="16" y="262" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">checkbox and a few fields</text><rect x="272" y="52" width="240" height="170" rx="4" fill="#F8F8F8" stroke="#E2E6EC" stroke-width="1"/><rect x="352" y="52" width="160" height="170" rx="0" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><rect x="353" y="52" width="159" height="34" rx="0" fill="#E6EFF8"/><rect x="362" y="64" width="50" height="8" rx="2" fill="#2B2F36"/><rect x="362" y="100" width="140" height="10" rx="2" fill="#F8F8F8"/><rect x="362" y="122" width="140" height="10" rx="2" fill="#F8F8F8"/><rect x="362" y="144" width="140" height="10" rx="2" fill="#F8F8F8"/><rect x="362" y="196" width="30" height="16" rx="3" fill="#0062B5"/><rect x="398" y="196" width="34" height="16" rx="3" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="272" y="244" font-size="13" fill="#2B2F36" font-weight="500" text-anchor="start">.ab-panel--wide · 720px</text><text x="272" y="262" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start"