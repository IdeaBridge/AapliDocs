<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Admin chips, badges and cards" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin chips, badges and cards</title>
<rect width="1040" height="330" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Chips, badges and cards</text><text x="16" y="64" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Chips (.ab-chip) — read only, not buttons</text><rect x="16" y="76" width="131.2" height="20" rx="10" fill="#F8F8F8" stroke="#E2E6EC" stroke-width="1"/><text x="24" y="90" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Content type: Idea</text><rect x="157.2" y="76" width="73.6" height="20" rx="10" fill="#E6EFF8"/><text x="165.2" y="90" font-size="12" fill="#0062B5" font-weight="400" text-anchor="start">Published</text><rect x="240.79999999999998" y="76" width="70.4" height="20" rx="10" fill="#EAF2EA"/><circle cx="250.79999999999998" cy="86" r="3" fill="#2E7D32"/><text x="258.79999999999995" y="90" font-size="12" fill="#2E7D32" font-weight="400" text-anchor="start">Active</text><rect x="321.2" y="76" width="64.0" height="20" rx="10" fill="#FDF5E0"/><circle cx="331.2" cy="86" r="3" fill="#8A5300"/><text x="339.2" y="90" font-size="12" fill="#8A5300" font-weight="400" text-anchor="start">Draft</text><rect x="395.2" y="76" width="70.4" height="20" rx="10" fill="#FBEDED"/><circle cx="405.2" cy="86" r="3" fill="#C62828"/><text x="413.2" y="90" font-size="12" fill="#C62828" font-weight="400" text-anchor="start">Failed</text><text x="600" y="64" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Badge (.ab-badge)</text><rect x="600" y="78" width="40" height="15" rx="7.5" fill="#0062B5"/><text x="620" y="89" font-size="10" fill="#fff" font-weight="500" text-anchor="middle" letter-spacing="0.6">NEW</text><text x="652" y="90" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">one word, remove after a release</text><text x="16" y="136" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Card (.ab-card)</text><rect x="16" y="148" width="300" height="90" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="32" y="176" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Idea template</text><text x="32" y="198" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">Title, description and attachments.</text><text x="340" y="136" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Selectable card, selected</text><rect x="340" y="148" width="300" height="90" rx="4" fill="#F7FAFD" stroke="#0062B5" stroke-width="1"/><rect x="340" y="148" width="3" height="90" rx="0" fill="#0062B5"/><rect x="358" y="164" width="18" height="18" rx="2" fill="#0062B5" stroke="#0062B5" stroke-width="2"/><g transform="translate(359,165) scale(0.8)"><path d="M4 10.5 L8 14.5 L16 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="388" y="178" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Challenge template</text><text x="388" y="200" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">Adds judging and stages.</text><text x="664" y="136" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Status flag (.ab-flag)</text><rect x="664" y="148" width="360" height="90" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><circle cx="684" cy="172" r="5" fill="#2E7D32"/><text x="698" y="177" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Export to IF tab: shown</text><text x="698" y="198" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">The front end finds ExportToIFTab = true</text><text x="698" y="214" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">in the saved properties, so the tab appears.</text><text x="16" y="270" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Chips 12px, 2px 8px, 10px radius. Status chips: tinted background, full-strength text, no border. Cards: white, 1px line, 4px radius, 14px 16px, no shadow.</text><text x="16" y="290" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Selected card: primary border, faint tint, 3px inset bar; ticking the card ticks its checkbox. Flag: 10px dot (muted / ok / error) + title 500 + why, 12px muted.</text>
</svg>
