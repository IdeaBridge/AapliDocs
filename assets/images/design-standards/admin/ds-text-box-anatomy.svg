<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="200" viewBox="0 0 1040 200" role="img" aria-label="Admin text box anatomy" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin text box anatomy</title>
<rect width="1040" height="200" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Text box anatomy (.ab-field)</text><text x="80" y="80" font-size="12" fill="#2B2F36" font-weight="500">Key<tspan fill="#C62828"> *</tspan></text><rect x="79" y="85" width="402" height="36" rx="5" fill="none" stroke="#0062B5" stroke-width="1"/><rect x="80" y="86" width="400" height="34" rx="4" fill="#FFFFFF" stroke="#0062B5" stroke-width="1"/><text x="89" y="108.0" font-size="13" fill="#2B2F36" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">ExportTo</text><line x1="153.4" y1="95" x2="153.4" y2="111" stroke="#2B2F36" stroke-width="1.2"/><text x="80" y="136" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Letters, numbers, _ - or . Up to 100 characters.</text><line x1="82" y1="74" x2="40" y2="62" stroke="#7A3E9D" stroke-width="1" stroke-dasharray="3 2"/><circle cx="82" cy="74" r="2.5" fill="#7A3E9D"/><circle cx="40" cy="62" r="10" fill="#7A3E9D"/><text x="40" y="66" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><line x1="110" y1="74" x2="160" y2="46" stroke="#7A3E9D" stroke-width="1" stroke-dasharray="3 2"/><circle cx="110" cy="74" r="2.5" fill="#7A3E9D"/><circle cx="160" cy="46" r="10" fill="#7A3E9D"/><text x="160" y="50" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><line x1="120" y1="103" x2="310" y2="56" stroke="#7A3E9D" stroke-width="1" stroke-dasharray="3 2"/><circle cx="120" cy="103" r="2.5" fill="#7A3E9D"/><circle cx="310" cy="56" r="10" fill="#7A3E9D"/><text x="310" y="60" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><line x1="480" y1="103" x2="510" y2="80" stroke="#7A3E9D" stroke-width="1" stroke-dasharray="3 2"/><circle cx="480" cy="103" r="2.5" fill="#7A3E9D"/><circle cx="510" cy="80" r="10" fill="#7A3E9D"/><text x="510" y="84" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><line x1="140" y1="132" x2="60" y2="166" stroke="#7A3E9D" stroke-width="1" stroke-dasharray="3 2"/><circle cx="140" cy="132" r="2.5" fill="#7A3E9D"/><circle cx="60" cy="166" r="10" fill="#7A3E9D"/><text x="60" y="170" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text><circle cx="570" cy="66" r="10" fill="#7A3E9D"/><text x="570" y="70" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="588" y="70" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Label · .ab-label 12 / 500, visible &lt;label for&gt;</text><circle cx="570" cy="96" r="10" fill="#7A3E9D"/><text x="570" y="100" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="588" y="100" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Required · &lt;span class=&quot;ab-required&quot;&gt;*&lt;/span&gt; in danger</text><circle cx="570" cy="126" r="10" fill="#7A3E9D"/><text x="570" y="130" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="588" y="130" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Input · .ab-input 34px, padding 7px 9px, 14px (mono 13px)</text><circle cx="570" cy="156" r="10" fill="#7A3E9D"/><text x="570" y="160" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="588" y="160" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Border 1px line, radius 4px · focus = primary + 1px ring</text><circle cx="570" cy="186" r="10" fill="#7A3E9D"/><text x="570" y="190" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="588" y="190" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Hint .ab-hint 12px muted · error .ab-error replaces it</text>
</svg>
