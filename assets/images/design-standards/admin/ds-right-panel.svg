<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-label="Admin right-hand panel" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin right-hand panel</title>
<rect width="1040" height="600" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Right-hand panel (.ab-panel)</text><rect x="16" y="50" width="660" height="534" rx="6" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><rect x="36" y="80" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="36" y="130" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="36" y="180" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="36" y="230" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="36" y="280" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="36" y="330" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="36" y="380" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="36" y="430" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="36" y="480" width="260" height="30" rx="4" fill="#F8F8F8"/><rect x="16" y="50" width="660" height="534" rx="6" fill="#0F1B2A" opacity="0.32"/><rect x="296" y="50" width="380" height="534" rx="0" fill="#FFFFFF"/><line x1="296" y1="50" x2="296" y2="584" stroke="#E2E6EC" stroke-width="1"/><rect x="297" y="50" width="379" height="96" rx="0" fill="#E6EFF8"/><text x="320" y="92" font-size="22" fill="#2B2F36" font-weight="500" text-anchor="start">AI chat</text><rect x="618" y="66" width="34" height="34" rx="4" fill="none"/><g transform="translate(625,73) scale(1.0)"><path d="M5 5 L15 15 M15 5 L5 15" fill="none" stroke="#5F6670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="320" y="122" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Let people ask questions about applications</text><text x="320" y="140" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">in a chat panel.</text><rect x="320" y="172" width="18" height="18" rx="2" fill="#0062B5" stroke="#0062B5" stroke-width="2"/><g transform="translate(321,173) scale(0.8)"><path d="M4 10.5 L8 14.5 L16 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="348" y="186" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Turn on AI chat</text><line x1="320" y1="214" x2="652" y2="214" stroke="#E2E6EC" stroke-width="1"/><text x="320" y="242" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">SETTINGS</text><text x="320" y="268" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Who can use AI chat</text><circle cx="329" cy="289" r="8.5" fill="#FFFFFF" stroke="#0062B5" stroke-width="2"/><circle cx="329" cy="289" r="4.5" fill="#0062B5"/><text x="348" y="294" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Everyone</text><circle cx="329" cy="319" r="8.5" fill="#FFFFFF" stroke="#5F6670" stroke-width="2"/><text x="348" y="324" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">People with the AI Assistant role</text><line x1="320" y1="354" x2="652" y2="354" stroke="#E2E6EC" stroke-width="1"/><text x="320" y="382" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">DAILY LIMIT</text><rect x="320" y="400" width="160" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="329" y="422.0" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">50</text><text x="320" y="450" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Questions per person per day</text><line x1="296" y1="520" x2="676" y2="520" stroke="#E2E6EC" stroke-width="1"/><rect x="320" y="536" width="85.36" height="34" rx="4" fill="#0062B5"/><g transform="translate(334,543.0) scale(1.0)"><rect x="3.5" y="3.5" width="13" height="13" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.7"/><rect x="6.5" y="3.5" width="7" height="4.5" rx="0" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="10" cy="12" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></g><text x="360" y="558.04" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="start">Save</text><rect x="413.36" y="536" width="75.04" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="427.36" y="558.04" font-size="14" fill="#0062B5" font-weight="500" text-anchor="start">Cancel</text><circle cx="292" cy="310" r="10" fill="#7A3E9D"/><text x="292" y="314" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="596" cy="78" r="10" fill="#7A3E9D"/><text x="596" y="82" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="616" cy="180" r="10" fill="#7A3E9D"/><text x="616" y="184" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="636" cy="284" r="10" fill="#7A3E9D"/><text x="636" y="288" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="616" cy="553" r="10" fill="#7A3E9D"/><text x="616" y="557" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text><circle cx="166" cy="550" r="10" fill="#7A3E9D"/><text x="166" y="554" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">6</text><circle cx="710" cy="64" r="10" fill="#7A3E9D"/><text x="710" y="68" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="728" y="68" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Panel</text><text x="728" y="85" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">fixed right, full height, min(520px, 100vw)</text><text x="728" y="101" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">--wide 720px · --xwide 960px</text><text x="728" y="117" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">role=&quot;dialog&quot; aria-modal, labelled by title</text><circle cx="710" cy="142" r="10" fill="#7A3E9D"/><text x="710" y="146" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="728" y="146" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Header band</text><text x="728" y="163" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">primary tint · title 22 / 500 · description</text><text x="728" y="179" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">close icon button top right</text><circle cx="710" cy="204" r="10" fill="#7A3E9D"/><text x="710" y="208" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="728" y="208" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">On / off</text><text x="728" y="225" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">checkbox “Turn on {feature}”, not a switch:</text><text x="728" y="241" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">nothing happens until Save</text><circle cx="710" cy="266" r="10" fill="#7A3E9D"/><text x="710" y="270" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="728" y="270" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Groups</text><text x="728" y="287" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">no box; split by hairlines, 20px either side</text><text x="728" y="303" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">shown only while the feature is on</text><circle cx="710" cy="328" r="10" fill="#7A3E9D"/><text x="710" y="332" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="728" y="332" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Footer</text><text x="728" y="349" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">pinned · Save (primary) then Cancel, left</text><text x="728" y="365" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">the one exception to “primary last”</text><circle cx="710" cy="390" r="10" fill="#7A3E9D"/><text x="710" y="394" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="728" y="394" font-size="12.5" fill="#2B2F36" font-weight="500" text-anchor="start">Scrim</text><text x="728" y="411" font-size="11.5" fill="#5F6670" font-weight="400" text-anchor="start">rgba(15,27,42,.32) · click closes · Esc closes</text>
</svg>
