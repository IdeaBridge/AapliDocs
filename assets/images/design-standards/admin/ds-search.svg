<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-label="Admin search and filter" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin search and filter</title>
<rect width="1040" height="380" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Search and filter</text><text x="16" y="62" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Empty</text><rect x="16" y="72" width="320" height="34" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><g transform="translate(24,79.0) scale(1.0)"><circle cx="8.5" cy="8.5" r="5.2" fill="none" stroke="#5F6670" stroke-width="1.8"/><path d="M12.5 12.5 L17 17" fill="none" stroke="#5F6670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="51" y="94.0" font-size="14" fill="#8A919B" font-weight="400" text-anchor="start">Search by name, email, role or status</text><text x="16" y="132" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">With a query</text><rect x="15" y="141" width="322" height="36" rx="5" fill="none" stroke="#0062B5" stroke-width="1"/><rect x="16" y="142" width="320" height="34" rx="4" fill="#FFFFFF" stroke="#0062B5" stroke-width="1"/><g transform="translate(24,149.0) scale(1.0)"><circle cx="8.5" cy="8.5" r="5.2" fill="none" stroke="#5F6670" stroke-width="1.8"/><path d="M12.5 12.5 L17 17" fill="none" stroke="#5F6670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="51" y="164.0" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">alex admin</text><line x1="127.2" y1="151" x2="127.2" y2="167" stroke="#2B2F36" stroke-width="1.2"/><g transform="translate(312,151) scale(0.8)"><path d="M5 5 L15 15 M15 5 L5 15" fill="none" stroke="#5F6670" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="16" y="200" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">320px in a toolbar · leading search icon · clear (×)</text><text x="16" y="218" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">once there is text · Esc clears · no search button</text><text x="380" y="62" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Matches highlighted, count announced</text><rect x="380" y="72" width="300" height="128" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><rect x="380" y="72" width="300" height="36" rx="0" fill="#F8F8F8"/><text x="392" y="94" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">NAME</text><text x="560" y="94" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">ROLE</text><line x1="380" y1="108" x2="680" y2="108" stroke="#E2E6EC" stroke-width="1"/><rect x="391" y="119" width="33.36" height="19" rx="2" fill="#FFF3B0"/><text x="392" y="133" font-size="14" fill="#2B2F36" font-weight="500">Alex<tspan font-weight="400"> Morgan</tspan></text><text x="560" y="133" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Administrator</text><line x1="380" y1="148" x2="680" y2="148" stroke="#E2E6EC" stroke-width="1"/><rect x="391" y="159" width="33.36" height="19" rx="2" fill="#FFF3B0"/><text x="392" y="173" font-size="14" fill="#2B2F36" font-weight="500">Alexis<tspan font-weight="400"> Rowe</tspan></text><text x="560" y="173" font-size="14" fill="#2B2F36" font-weight="400" text-anchor="start">Contributor</text><text x="380" y="222" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">“alex admin”: each word must match a field</text><text x="380" y="240" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">aria-live: “2 users match”</text><text x="720" y="62" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">No results</text><rect x="720" y="72" width="304" height="128" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="872" y="126" font-size="14" fill="#5F6670" font-weight="400" text-anchor="middle">No users match “alxe”.</text><rect x="820" y="144" width="122.08000000000001" height="34" rx="4" fill="none"/><text x="834" y="166.04" font-size="14" fill="#5F6670" font-weight="500" text-anchor="start">Clear search</text><text x="720" y="222" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Query in quotes, plus a way to clear it.</text><rect x="16" y="270" width="1008" height="92" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="32" y="294" font-size="12" fill="#2B2F36" font-weight="500" text-anchor="start">Rules</text><text x="32" y="316" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Filter as you type. Placeholder names what is searched (“Search users”, “Search by name, email, role or status”), never just “Search”.</text><text x="32" y="336" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start">Highlight matches with .ab-mark (soft yellow). Lists whose rows are data have their own search box; the nav search finds screens and third-level pages.</text>
</svg>
