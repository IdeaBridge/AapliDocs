<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Admin notes and API preview" font-family="Roboto, system-ui, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Admin notes and API preview</title>
<rect width="1040" height="330" fill="#F4F6F9"/>
<text x="16" y="30" font-size="15" fill="#2B2F36" font-weight="500" text-anchor="start">Notes and API preview</text><rect x="16" y="52" width="480" height="50" rx="4" fill="#F8F8F8" stroke="#E2E6EC" stroke-width="1"/><text x="32" y="82" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">Keys are case-insensitive and must be unique.</text><text x="510" y="82" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">.ab-note</text><rect x="16" y="114" width="480" height="50" rx="4" fill="#F8F8F8" stroke="#E2E6EC" stroke-width="1"/><rect x="16" y="114" width="3" height="50" rx="0" fill="#0062B5"/><text x="32" y="144" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">Only a Points Admin can change this.</text><text x="510" y="144" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">.ab-note--info</text><rect x="16" y="176" width="480" height="50" rx="4" fill="#FDF5E0" stroke="#E2E6EC" stroke-width="1"/><rect x="16" y="176" width="3" height="50" rx="0" fill="#8A5300"/><text x="32" y="206" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">Turning this off resets everyone’s points.</text><text x="510" y="206" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">.ab-note--warn</text><rect x="16" y="238" width="480" height="50" rx="4" fill="#FBEDED" stroke="#E2E6EC" stroke-width="1"/><rect x="16" y="238" width="3" height="50" rx="0" fill="#C62828"/><text x="32" y="268" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">We couldn’t load the features. Try again.</text><text x="510" y="268" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">.ab-note--danger</text><text x="640" y="60" font-size="11" fill="#5F6670" font-weight="500" text-anchor="start" letter-spacing="0.66">RETURNED BY CONTENT/GET</text><text x="640" y="86" font-size="12" fill="#2E7D32" font-weight="500" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">GET</text><text x="672" y="86" font-size="12" fill="#2B2F36" font-weight="400" text-anchor="start" font-family="'Roboto Mono', Consolas, Menlo, monospace">/api/content/get?id=1042</text><rect x="640" y="100" width="384" height="130" rx="4" fill="#0F1B2A"/><text x="654" y="124" font-size="12" font-family="'Roboto Mono', Consolas, Menlo, monospace" fill="#D6E4F5">{<tspan fill="#A5D6A7"></tspan></text><text x="654" y="144" font-size="12" font-family="'Roboto Mono', Consolas, Menlo, monospace" fill="#7CC4FF">  &quot;Id&quot;: <tspan fill="#A5D6A7">1042</tspan></text><text x="654" y="164" font-size="12" font-family="'Roboto Mono', Consolas, Menlo, monospace" fill="#D6E4F5">  &quot;CustomProperties&quot;: {<tspan fill="#A5D6A7"></tspan></text><text x="654" y="184" font-size="12" font-family="'Roboto Mono', Consolas, Menlo, monospace" fill="#7CC4FF">    &quot;ExportToIFTab&quot;: <tspan fill="#A5D6A7">&quot;true&quot;</tspan></text><text x="654" y="204" font-size="12" font-family="'Roboto Mono', Consolas, Menlo, monospace" fill="#D6E4F5">  }, …<tspan fill="#A5D6A7"></tspan></text><text x="640" y="256" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Preview shows the saved state, not unsaved edits.</text><text x="640" y="274" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Elide unrelated fields with “…”. Escape everything.</text><text x="16" y="312" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Notes: surface-2, 1px border, 14px 16px, muted, 1.55 line height, max 70ch. For things to know, not things to act on now.</text>
</svg>
