"start">Administrator</text><text x="600" y="98" font-size="14" fill="#2B2F36" font-weight="500" text-anchor="start">Alex Morgan</text><rect x="806" y="50" width="218" height="64" rx="4" fill="#FFFFFF" stroke="#E2E6EC" stroke-width="1"/><text x="822" y="74" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Loading</text><text x="822" y="98" font-size="22" fill="#2B2F36" font-weight="500" text-anchor="start">…</text><text x="16" y="144" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">2–4 tiles between the title and the actions. Label 12px muted; value 22 / 500 with tabular figures; words 14px. “…” while loading, “–” when missing.</text><text x="16" y="164" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">Danger tile for figures that need attention. A figure that links to a filtered list makes the whole tile the link. Never a substitute for the table.</text>
